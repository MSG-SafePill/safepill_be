# Loaded for every profile; application properties/environment can override these defaults.
spring.servlet.multipart.max-file-size=30MB
# Leave room for multipart headers around a 30 MiB file.
spring.servlet.multipart.max-request-size=31MB
safepill.ai.base-url=${SAFEPILL_AI_BASE_URL:http://localhost:8000}
safepill.ai.image-connect-timeout-ms=${SAFEPILL_AI_IMAGE_CONNECT_TIMEOUT_MS:3000}
safepill.ai.image-read-timeout-ms=${SAFEPILL_AI_IMAGE_READ_TIMEOUT_MS:60000}
safepill.ai.image-total-timeout-ms=${SAFEPILL_AI_IMAGE_TOTAL_TIMEOUT_MS:70000}
