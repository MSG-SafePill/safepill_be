services:
  postgres:
    image: postgres:16-alpine
    container_name: safepill-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-safepill}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - safepill-postgres-data:/var/lib/postgresql/data
      - ./database/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-safepill}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  safepill-postgres-data:
